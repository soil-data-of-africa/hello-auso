project:
  type: website
  resources:
    - img/*
  render:
    - "*.md"
    - "*.qmd"

website:
  repo-url: https://github.com/soil-data-of-africa
  repo-subdir: src
  page-footer:
    left:
    - text: This initiative has received funding from the EU Horizon Research and Innovation Programme under Grant Agreement <a href='https://doi.org/10.3030/101218840'>101218840</a>. 
  title: "African Union Soil Observatory"
  search: true
  navbar:
    pinned: true
    logo: ./img/logo-bw.png
    right:
      - text: About AUSO
        file: about.md
      - text: Who it's for
        file: who.md
      - text: Dashboard
        file: asdac/index.md
      - text: Resources
        file: asdac/resources/index.md
      - text: Contact
        file: contact.md
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: Summary
        file: asdac/index.md
      - text: Map
        file: asdac/map.qmd
      - text: Prioritize
        file: asdac/prioritize.md
      - text: Interventions
        file: asdac/interventions.md
      - text: Data Catalogue
        file: asdac/catalogue/index.qmd
      - text: Tools and Resources
        file: asdac/resources/index.md
        menu:
        - text: Documents
          file: asdac/resources/documents.md
        - text: Procedures
          file: asdac/resources/procedures.md
        - text: Data platforms
          file: asdac/resources/data-platforms.md
        - text: Code Repositories
          file: asdac/resources/code-repositories.md
        - text: Videos
          file: asdac/resources/videos.md
        - text: Tech manuals
          file: asdac/resources/tech-manuals.md
        - text: SIS software
          file: asdac/resources/sis-software.md
      - text: Community
        file: asdac/community.md
      - text: FAQ
        file: asdac/faq.md
format:
  html:
    page-layout: full
    theme: 
      - flatly
      - styles.scss
    filters:
      - ./filters/collapse/_extensions/collapse/collapse.lua
      - ./filters/page-section/_extensions/page-section/page-section.lua
    shortcodes: 
      - ./shortcodes/icon-link/_extensions/icon-link/icon-link.lua
